<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥩</text></svg>" />
    <!-- viewport-fit=cover est indispensable pour que les safe-area-inset fonctionnent sous encoche -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1210" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Commandez vos découpes de viande halal, préparées et livrées à Dakar." />
    <!-- Installable en appli (iOS « Ajouter à l'écran d'accueil ») -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PROFOOD" />
    <link rel="apple-touch-icon" href="./icons/icon-180.png" />
    <!-- Polices : chargées ici (autorisé dans le WebView natif et en dev navigateur). Sora = display, Inter = corps. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- display=block sur la police d'icônes : pas de flash du texte du ligature (ex. « shopping_bag ») avant chargement -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL@20..48,100..700,0..1&display=block" rel="stylesheet" />
    <title>PROFOOD — Boucherie halal Dakar</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
